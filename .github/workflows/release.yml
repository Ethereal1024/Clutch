# Build the Clutch desktop deb on a tag push (vX.Y.Z) and attach it to the
# GitHub release. The deb is self-contained: bundled PyInstaller backend +
# Electron GUI, click-to-use with no python/pip on the target machine.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      - name: Build bundled server (PyInstaller onefile)
        run: bash scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" dist/agent-server

      - name: Generate app icon
        run: .venv/bin/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build deb
        working-directory: ui
        run: npm run dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-deb
          path: ui/dist/*.deb

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb
