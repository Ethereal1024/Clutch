# Build the Clutch desktop releases on a tag push (vX.Y.Z) and attach them to
# the GitHub release. Both artifacts are self-contained: bundled PyInstaller
# backend + Electron GUI, click-to-use with no python/pip on the target machine.
#  - deb  : Linux x86_64 (ubuntu-latest)
#  - dmg  : macOS arm64 / Apple Silicon (macos-latest), UNSIGNED — first launch
#           is blocked by Gatekeeper with a misleading "damaged" notice (macOS 15
#           removed the right-click -> Open bypass); clear it with
#           `xattr -cr /Applications/Clutch.app` until the project picks up
#           Developer ID signing + notarization.
#  - win  : Windows x64 NSIS (windows-latest), UNSIGNED — SmartScreen warns on
#           the first run ("Windows protected your PC" -> More info -> Run
#           anyway). This job must run on Windows: the bundled backend is a
#           PyInstaller onefile .exe and PyInstaller cannot cross-compile.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---- verify: the one gate every artifact job depends on ----
  # Why it exists: 0.1.51 and 0.1.52 shipped an APK + pylibs tars and NO deb,
  # because the phone chain (pylibs -> apk) had no dependency on the desktop
  # job at all — the desktop build failed its font scan and nothing downstream
  # noticed, so a release could go out with only the artifacts built from a
  # tree that never passed the checks. A tag push must publish everything or
  # nothing, so every job below lists this one in `needs:` and a failing check
  # stops the run before any asset is attached.
  #
  # What that does NOT buy, and 0.1.56 showed it: the gate sits UPSTREAM of the
  # attach steps, so it is not a transaction around them. `win`'s `uv sync`
  # exited 1 (uv.lock unchanged since 0.1.55, where the same job passed — no log
  # beyond the exit code is readable without admin) while the release already
  # carried the deb, the dmg, the APK and the pylibs tars: 20 of 21 assets,
  # published, with nothing to roll back. The repair is a re-run of the failed
  # job from the run page — it attaches to the SAME release — not a new tag,
  # which leaves the partial one standing next to it forever.
  #
  # 0.2.0 then showed the limit of that repair: `deb` died in `npm ci` (the
  # lockfile pointed at a mirror that had gone away), and a re-run rebuilds the
  # tag's OWN commit, so it cannot pick up a fix. The repair is the commit plus
  # MOVING the tag onto it (`git tag -f`, `git push -f refs/tags/vX.Y.Z`): a
  # fresh run that fills the same release, honest as long as nothing has been
  # attached yet. Still one tag per version — a second version tag beside a
  # half-built release is the thing not to do.
  #
  # Stdlib only, on purpose: the scans below import no third-party package, so
  # `python3 -m` works on the runner image without uv sync / npm ci — the gate
  # costs seconds and cannot itself fail for a dependency reason.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # font wiring guard: a root-absolute @font-face url resolves to file:///… and
      # fails silently, which is how every platform ended up in its own OS face
      # (tests/ui_fonts_check.py docstring). Offline, no browser, no deps.
      - name: Verify UI fonts
        run: python3 -m tests.ui_fonts_check

      # stylesheet wiring guard: ui/mobile.css is linked ONLY under
      # media="(max-width: 640px)", so a comment that ended early in it killed
      # every phone rule (and nothing else) for nine releases, with no desktop
      # symptom to notice (tests/ui_css_check.py docstring). Offline, no browser,
      # no deps — the scan is stdlib.
      - name: Verify UI stylesheets
        run: python3 -m tests.ui_css_check

      # The launcher icon: the 0.1.44 APK went out with `icon=''` — no
      # android:icon and no mipmap at all — and nothing else in the pipeline
      # notices (the build, the install and every other job are green either
      # way). tests/android_icon_check.py docstring.
      - name: Verify the launcher icon
        run: python3 -m tests.android_icon_check

      # The machine's half of the split: `agent/` must BE the execution layer,
      # with nothing of the loop left on its import graph — the message
      # projector nothing shipped imports, a resurrected `render("system.md")`,
      # a model client, an orphan module (tests/exec_layer_test.py docstring).
      # Offline and stdlib only, like the scans above.
      - name: Verify the execution layer
        run: python3 -m tests.exec_layer_test

      # The gate's own wiring: every job that attaches an asset must reach this
      # one, and the phone chain must also reach `deb` — the 0.1.51/0.1.52
      # half-published releases (tests/release_graph_check.py docstring). A
      # `needs:` removed by a future edit fails here, before the next tag.
      - name: Verify the release graph
        run: python3 -m tests.release_graph_check

      # The declared python floor, read where it is written: the `requires-python`
      # /ruff `target-version` pair (the components' pairs too, when their
      # submodules are checked out — this job has none, and the check prints the
      # two trees it did not read), PY_FLOOR in the tunnel (which is what REFUSES
      # an older remote), and the `verify-py38` leg below. This half is the cheap
      # net — the runner's python is 3.12, where every construct the floor cannot
      # run works fine. The authority is the 3.8 leg; this is what catches a
      # drift in seconds.
      - name: Verify the declared python floor
        run: python3 -m tests.py38_check

      # The committed build outputs, in a bare checkout: ui/*.js and
      # android/host/*.js are emitted from TypeScript and are what actually
      # ships (the phone's libnode 18 cannot strip types, the Electron main runs
      # .js by path), so a source edited without a rebuild ships code nobody
      # wrote. scripts/sync-android-host.sh runs exactly these `--check` gates
      # when it assembles the APK — and 0.2.0's APK job is where the outage
      # landed: the gate demanded typescript (which that job installs no
      # packages for) and died 19 seconds in, AFTER deb/dmg/win had attached.
      # Both suites are dependency-free and take about a second: node only, no
      # npm install, so they belong here — where a rejected tree reaches no
      # release at all — instead of only in the last job in the chain.
      - name: Verify the committed build outputs
        run: |
          node tests/host-built.test.js
          node tests/android-built.test.js

      # The pylibs tar's sha256 is a VERSION, not a checksum: it is the asset
      # name the release publishes and the value the remote compares before
      # reinstalling. 0.2.0's release carries the proof that it was not one —
      # two runs over the same 1974 files published two names for them
      # (…-37df4cf252b7cb0a and …-8ef08185757ac59d) because `tar` wrote them in
      # readdir order, and a fresh checkout hands that back differently. This
      # gate packs one tree twice, created in opposite orders under different
      # umasks and clocks, and requires one hash — python3 only, no venv, no
      # network, so it belongs here rather than in the legs that need PyPI.
      - name: Verify the pylibs tar packer
        run: node tests/pylibs-tar-pack-test.js

  # ---- verify-py38: the declared floor, on the interpreter the floor names ----
  # `verify` above runs on the runner's own python (3.12), where a PEP 585 alias,
  # a `dict | dict` merge and `Path.write_text(newline=)` all work — which is the
  # whole reason a floor needs a leg of its own, and why 0.2.x could declare 3.10
  # and never notice that `agent/` was unimportable on anything older (ten
  # module-level aliases, a parenthesized `with`, `sys.stdlib_module_names`).
  # The machines this promise is FOR are Ubuntu 20.04 GUI hosts, whose system
  # python3 is 3.8.10: they are the ones that run a `pylibs` tar with no install,
  # and `ui/src/host/tunnel-bootstrap.ts` turns the floor into a refusal at the
  # door for anything older.
  #
  # No third-party package anywhere in this job: the suite is stdlib-only, which
  # is exactly the property the far side depends on (scripts/build-pylibs-tar.sh
  # ships `agent/` and an EMPTY site-packages), so a green run here is also a
  # check that no test quietly grew a dependency.
  #
  # It gates `deb`, and `dmg` / `win` / `pylibs-matrix` / `android-apk` reach it
  # through `deb`'s `needs:` — one line to read (tests/release_graph_check.py
  # reads that line, tests/py38_check.py requires this job to exist).
  # ubuntu-22.04 and not -latest: `actions/setup-python` has no 3.8 in its tool
  # cache for 24.04 (`ubuntu-latest`), and the job died in "Set up Python" before
  # it ran a single test — a leg that cannot start is not a floor check. 22.04 is
  # the newest image that still carries 3.8, and it was measured, not assumed:
  # the first run of this job on 24.04 failed exactly there.
  verify-py38:
    runs-on: ubuntu-22.04
    steps:
      # The ONE job that checks out the components, and it has to: read_file /
      # grep / write_file / edit_file are DECLARED by a component, so a host with
      # an empty store cannot execute them at all — on a bare checkout this suite
      # fails for "no such tool", which says nothing about the interpreter. A
      # component's package is also what a remote executes, so its code is part
      # of the floor (tests/py38_check.py scans these trees when they are here,
      # and says so when they are not). The price of the honesty: a component
      # that does not hold the floor turns this job red BY NAME — the file and
      # the construct — instead of shipping a tar that dies on the user's 3.8 box.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Verify the declared python floor
        run: python -m tests.py38_check

      # Installs this checkout's own components through the host's real install
      # channel (scripts/install-component.py), the same way a client's upload
      # lands — not a path into the working tree.
      - name: Install the components this checkout ships
        run: python scripts/install-component.py clutch-workspace clutch-skills

      - name: Every suite, on the floor
        run: |
          # selfcheck is the end-to-end runner and is not named *_test.py
          fail=0
          # One module's verdict, and — when it is red — the reason, said in a
          # place a reader can reach. A failed step's LOG needs a GitHub login to
          # open; an annotation does not, and the run page shows it as-is. So the
          # last lines of the module that broke are repeated as one annotation
          # (a step may add ten, hence one per module and not one per line).
          # The loop also does not stop at the first failure: a floor broken in
          # three places should say three things in one run, not over three runs.
          suite() {
            python -m "$1" > "/tmp/floor-$1.log" 2>&1 || {
              echo "::error title=$1::$(tail -n 40 "/tmp/floor-$1.log" | tr '\n' ' ' | tr -d '\r' | sed 's/%/%25/g')"
              fail=1
            }
          }
          suite tests.selfcheck
          suite tests.lazy_check
          for file in tests/*_test.py; do
            echo "--- $file"
            suite "tests.$(basename "$file" .py)"
          done
          exit "$fail"

  deb:
    runs-on: ubuntu-latest
    needs: [verify, verify-py38]
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module —
      # a release must not depend on one being checked out (or published).
      # fetch-depth: 0 — the release page's body is the tag's own note, and a
      # shallow checkout has no tag object to read it from (see "Read the tag's
      # note" below; the repo is ~26 MiB, so the full graph is cheap here).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      - name: Build bundled server (PyInstaller onefile)
        run: bash scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" dist/agent-server

      - name: Generate app icon
        run: .venv/bin/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # platform extraResources/icon guard (no build): see ui/verify-build-config.js
      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      # The font/stylesheet/icon scans used to run here. They now run in the
      # `verify` job this one needs, so that pylibs/apk (which must not publish
      # a tree the checks reject) are gated by the same single pass instead of
      # by a copy of it. Nothing was dropped: see `verify` above.

      - name: Build deb
        working-directory: ui
        run: npm run dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-deb
          path: ui/dist/*.deb

      # The page a release gets is the note its tag already carries (`git tag -a
      # -F`): read here, not written a second time, so there is nothing to keep in
      # sync. Every release up to 0.2.1 went out blank because this step did not
      # exist. `deb` is the job that CREATES the release (the other legs only add
      # files), so this is the one place the body is set; a later attach without a
      # body keeps it (action-gh-release: `body = workflowBody || existingReleaseBody`).
      #
      # A tag that is not annotated has no note to show, so the release stops here
      # instead of publishing a page that says nothing. The tag is already pushed
      # by then — but nothing has been published, and the fix is one `git tag -a`.
      - name: Read the tag's note
        run: |
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "tag $GITHUB_REF_NAME is lightweight: a release page is its tag's note" >&2
            echo "re-tag with: git tag -a $GITHUB_REF_NAME -F <notes>" >&2
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "tag $GITHUB_REF_NAME carries an empty note: a release page has to say what changed" >&2
            exit 1
          fi

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: ui/dist/*.deb

  # macOS build must run on macOS (no cross-compiling mac targets from Linux).
  # needs: deb -> the deb job creates the release, this one only adds files
  # (avoids the jobs racing to create it).
  dmg:
    runs-on: macos-latest
    needs: deb
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      - name: Build bundled server (PyInstaller onefile)
        shell: bash
        run: bash scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" dist/agent-server

      - name: Generate app icon
        run: .venv/bin/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      - name: Build dmg (unsigned arm64)
        working-directory: ui
        run: npm run dist:mac
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned: skip codesign identity lookup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-dmg
          path: ui/dist/*.dmg

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.dmg

  # Windows build must run on Windows: the bundled backend is a PyInstaller
  # onefile .exe and PyInstaller cannot cross-compile (this is why the mac job's
  # "no cross-compiling" caveat does NOT apply the other way — NSIS itself is
  # portable, the .exe backend is the hard dependency). Pipeline is the proven
  # windows-debug.yml one plus the font guard and the release attachment.
  win:
    runs-on: windows-latest
    needs: deb
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      # Windows PyInstaller wants ';' as the --add-data separator (':' would be
      # taken literally) and the venv interpreter lives in Scripts\python.exe.
      # Output: dist/agent-server.exe + dist/agent-supervisor.exe.
      # Nothing of a module is added: no component's code, no skills library.
      # The three POSIX jobs call scripts/build-server-bundle.sh instead; this
      # job has to spell the command out because of the ';' separator.
      - name: Build bundled server + supervisor (PyInstaller onefile)
        shell: bash
        run: |
          set -euo pipefail
          .venv/Scripts/python -m PyInstaller --noconfirm --onefile --name agent-server \
            --add-data "agent/prompts;agent/prompts" \
            --add-data "agent/transport_defaults.json;agent/" \
            scripts/server_entry.py
          .venv/Scripts/python -m PyInstaller --noconfirm --onefile --name agent-supervisor \
            scripts/supervisor_entry.py
          ls -l dist/

      - name: Generate app icon (png/svg + win ico)
        shell: bash
        run: .venv/Scripts/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # same guard as `predist`, which vite/npm does not run for dist:win
      - name: Check transport_defaults drift
        shell: bash
        run: bash scripts/check-transport-defaults.sh

      # platform extraResources/icon guard (no build): see ui/verify-build-config.js
      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      # font wiring guard: the deb job runs it; windows-debug.yml omits it
      - name: Verify UI fonts
        shell: bash
        run: .venv/Scripts/python -m tests.ui_fonts_check

      # stylesheet wiring guard: the deb job runs it (tests/ui_css_check.py)
      - name: Verify UI stylesheets
        shell: bash
        run: .venv/Scripts/python -m tests.ui_css_check

      - name: Build unsigned NSIS installer
        working-directory: ui
        run: npm run dist:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-win
          path: ui/dist/*.exe

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.exe

  # ---- pylibs-matrix (M2 supply line for Android, docs/android/02 §7) ----
  # The phone has no pip/bash: its pylibs tar comes from these CI prebuilts
  # (byte-deterministic, so the tar's sha256 IS the remote's VERSION gate and
  # the phone's ~/.clutch/bundles cache stays valid).
  #
  # What the tar carries is `agent/` (its own code, stdlib-only — pyproject.toml
  # declares no dependencies) plus an EMPTY `site-packages/`. There is nothing
  # to fetch for a target, so the target is a LABEL: it decides which asset a
  # remote is offered and nothing about the bytes. Every cell of this matrix
  # emits the same archive, hash included, on purpose — removing the wheel set
  # (openai/httpx2 and, through them, pydantic/pydantic_core/jiter) removed the
  # Python >= 3.9/3.10 floor that came with it.
  #
  # The axis is therefore PLATFORM, not interpreter: a py<ver> axis was what made
  # the floor real in the wrong place — ">= 3.8" could only be true if every
  # minor version in that range had a cell, and a remote running a version nobody
  # enumerated (3.9, or 3.14 the day it ships) could not find an artifact at all.
  # The floor now lives where it is declared: `requires-python = ">=3.8"` plus
  # the `verify-py38` leg below. What stays platform-shaped is the promise of
  # WHICH platforms get an artifact (a riscv64 remote is refused by name, never
  # handed a guess).
  #
  # The interpreter below only has to run the packer
  # (scripts/pack-pylibs-tar.py), not resolve anything.
  pylibs-matrix:
    runs-on: ubuntu-latest
    # needs: deb, not just for ordering — this is the other half of the
    # 0.1.51/0.1.52 repair. The phone chain used to start in parallel with the
    # desktop build, so a failed/half-built desktop release still published
    # tars + an APK pointing at them: a release with a working phone installer
    # and no desktop package. Waiting for `deb` (which waits for `verify`) means
    # the release object exists and the tree passed the checks before a single
    # tar is attached; if the deb build dies, no phone asset appears either.
    needs: [verify, deb]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v4
      # no submodules: the tar carries agent/ + site-packages only; the tool
      # modules are installed onto the remote later via components install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # only runs the packer; the tar's bytes do not depend on it

      - name: Build pylibs tar (linux/${{ matrix.arch }}/${{ matrix.libc }})
        id: build
        run: |
          set -euo pipefail
          # <out> <os> <arch> <libc>: the platform is the whole contract, so the
          # script takes it and nothing else (no key, no interpreter version).
          bash scripts/build-pylibs-tar.sh pylibs.tar.gz \
            Linux ${{ matrix.arch }} ${{ matrix.libc }}
          SHA256="$(sha256sum pylibs.tar.gz | cut -d' ' -f1)"
          NAME="agent-pylibs-linux-${{ matrix.arch }}-${{ matrix.libc }}-${SHA256:0:16}.tar.gz"
          mv pylibs.tar.gz "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pylibs-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: ${{ steps.build.outputs.file }}
          if-no-files-found: error

  # Assemble the release index the Android downloader reads (N3): one entry per
  # target, keyed exactly like artifact-provider-android.js builds its key
  # ("<os>-<arch>-<libc>", lowercase — no interpreter, see the note above).
  # The filename hash must equal the content hash — the M2 acceptance is "remote
  # VERSION == tar hash", and the phone recomputes the hash instead of trusting
  # this manifest.
  pylibs-index:
    needs: pylibs-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pylibs-*
          merge-multiple: true

      - name: Build pylibs-index.json
        run: |
          python3 - <<'EOF'
          import hashlib, json, pathlib
          tars = sorted(pathlib.Path("artifacts").glob("agent-pylibs-*.tar.gz"))
          assert tars, "no pylibs artifacts found"
          index = {}
          for p in tars:
              # agent-pylibs-linux-<arch>-<libc>-<hash16>.tar.gz
              key = p.name[len("agent-pylibs-"):-len(".tar.gz")].rsplit("-", 1)[0]
              stated = p.name.rsplit("-", 1)[-1][:16]
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              assert stated == sha[:16], f"{p.name}: filename hash {stated} != content {sha[:16]}"
              index[key] = {"file": p.name, "sha256": sha, "version": sha[:16]}
          pathlib.Path("pylibs-index.json").write_text(json.dumps(index, indent=1, sort_keys=True) + "\n")
          print(json.dumps(index, indent=1))
          EOF

      - name: Attach tars + index to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pylibs-index.json
            artifacts/agent-pylibs-*.tar.gz

  # ---- android-apk (M3: the phone build, docs/android/02 §8) ----
  # needs: pylibs-index, not just for ordering — this job stamps the URL of
  # THIS tag's pylibs-index.json release asset into the APK, so that URL only
  # resolves after pylibs-index's attach step above has completed (needs =
  # whole job, attach included). The APK is a DEBUG build signed with the
  # PROJECT's own keystore (android/keystore/clutch.jks, wired in
  # android/app/build.gradle): debug-flavoured to keep the WebView debuggable,
  # and signed by ONE stable certificate so each release installs over the
  # previous one — a runner's auto-generated debug keystore gave every release a
  # key of its own, which turned every "install over" into a reinstall.
  android-apk:
    needs: pylibs-index
    runs-on: ubuntu-latest
    steps:
      # no submodules: the APK carries android/host + the in-repo ui/ subset
      # (components.js and ui/vendor are tracked files); pylibs reach the
      # phone at RUNTIME through the stamped index, never at build time
      - uses: actions/checkout@v4

      # The launcher icon check moved to the `verify` job (this job reaches it
      # through pylibs-index -> pylibs-matrix -> verify), so a missing icon now
      # blocks the run before any tar or APK is attached instead of after.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17" # AGP 8.5 floor

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # sync-android-host.sh runs npm install for the host bundle

      # do NOT assume the image preinstalls the Android SDK (the first
      # android-debug run died 127 on a bare `sdkmanager`): resolve it or
      # install cmdline-tools explicitly, then let AGP know via ANDROID_HOME
      - name: Ensure Android SDK + components
        run: |
          set -euo pipefail
          AH="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "no preinstalled sdkmanager at $SDKM — installing cmdline-tools"
            mkdir -p "$AH/cmdline-tools"
            curl -sSL --fail -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdtools.zip -d cmdtools-x
            mv cmdtools-x/cmdline-tools "$AH/cmdline-tools/latest"
            rm -rf cmdtools.zip cmdtools-x
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          bash scripts/build-android-apk.sh \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pylibs-index.json" \
            "${GITHUB_REF_NAME#v}" \
            "clutch-android-${GITHUB_REF_NAME}.apk" 2>&1 | tee /tmp/clutch-apk-build.log

      # Whose eyes need this? The person who notices a broken APK is holding the
      # PHONE, and a failure here can also be read by tooling that has no
      # Actions-log access (the log endpoint wants admin rights). So a failed
      # build leaves its own tail as a COMMENT ON THE COMMIT — readable by
      # anyone, from anywhere, with no token.
      - name: Post the build log where a failure can be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          log = pathlib.Path("/tmp/clutch-apk-build.log")
          tail = log.read_text(errors="replace")[-6000:] if log.exists() else "(no build log was captured)"
          body = "android-apk build failed (run %s, commit %s)\n\n```\n%s\n```\n" % (
              os.environ.get("GITHUB_RUN_ID", "?"), os.environ.get("GITHUB_SHA", "?"), tail)
          pathlib.Path("/tmp/clutch-apk-comment.json").write_text(json.dumps({"body": body}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data @/tmp/clutch-apk-comment.json -o /tmp/clutch-apk-comment.out -w 'comment: HTTP %{http_code}\n' \
            || echo "could not post the build log (the job already failed; this is only the report)"

      - uses: actions/upload-artifact@v4
        with:
          name: clutch-android-apk
          path: clutch-android-*.apk
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: clutch-android-*.apk
