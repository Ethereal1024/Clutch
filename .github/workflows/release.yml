# Build the Clutch desktop releases on a tag push (vX.Y.Z) and attach them to
# the GitHub release. Both artifacts are self-contained: bundled PyInstaller
# backend + Electron GUI, click-to-use with no python/pip on the target machine.
#  - deb  : Linux x86_64 (ubuntu-latest)
#  - dmg  : macOS arm64 / Apple Silicon (macos-latest), UNSIGNED — first launch
#           is blocked by Gatekeeper with a misleading "damaged" notice (macOS 15
#           removed the right-click -> Open bypass); clear it with
#           `xattr -cr /Applications/Clutch.app` until the project picks up
#           Developer ID signing + notarization.
#  - win  : Windows x64 NSIS (windows-latest), UNSIGNED — SmartScreen warns on
#           the first run ("Windows protected your PC" -> More info -> Run
#           anyway). This job must run on Windows: the bundled backend is a
#           PyInstaller onefile .exe and PyInstaller cannot cross-compile.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module —
      # a release must not depend on one being checked out (or published).
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      - name: Build bundled server (PyInstaller onefile)
        run: bash scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" dist/agent-server

      - name: Generate app icon
        run: .venv/bin/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # platform extraResources/icon guard (no build): see ui/verify-build-config.js
      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      # font wiring guard: a root-absolute @font-face url resolves to file:///… and
      # fails silently, which is how every platform ended up in its own OS face
      # (tests/ui_fonts_check.py docstring). Offline, no browser, no deps.
      - name: Verify UI fonts
        run: .venv/bin/python -m tests.ui_fonts_check

      - name: Build deb
        working-directory: ui
        run: npm run dist
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-deb
          path: ui/dist/*.deb

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb

  # macOS build must run on macOS (no cross-compiling mac targets from Linux).
  # needs: deb -> the deb job creates the release, this one only adds files
  # (avoids the jobs racing to create it).
  dmg:
    runs-on: macos-latest
    needs: deb
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      - name: Build bundled server (PyInstaller onefile)
        shell: bash
        run: bash scripts/build-server-bundle.sh "${GITHUB_REF_NAME#v}" dist/agent-server

      - name: Generate app icon
        run: .venv/bin/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      - name: Build dmg (unsigned arm64)
        working-directory: ui
        run: npm run dist:mac
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned: skip codesign identity lookup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-dmg
          path: ui/dist/*.dmg

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.dmg

  # Windows build must run on Windows: the bundled backend is a PyInstaller
  # onefile .exe and PyInstaller cannot cross-compile (this is why the mac job's
  # "no cross-compiling" caveat does NOT apply the other way — NSIS itself is
  # portable, the .exe backend is the hard dependency). Pipeline is the proven
  # windows-debug.yml one plus the font guard and the release attachment.
  win:
    runs-on: windows-latest
    needs: deb
    steps:
      # No submodules: the bundle is the HOST's own code and carries no module.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (PyInstaller, etc.)
        run: uv sync

      # Windows PyInstaller wants ';' as the --add-data separator (':' would be
      # taken literally) and the venv interpreter lives in Scripts\python.exe.
      # Output: dist/agent-server.exe + dist/agent-supervisor.exe.
      # Nothing of a module is added: no component's code, no skills library.
      # The three POSIX jobs call scripts/build-server-bundle.sh instead; this
      # job has to spell the command out because of the ';' separator.
      - name: Build bundled server + supervisor (PyInstaller onefile)
        shell: bash
        run: |
          set -euo pipefail
          .venv/Scripts/python -m PyInstaller --noconfirm --onefile --name agent-server \
            --add-data "agent/prompts;agent/prompts" \
            --add-data "agent/transport_defaults.json;agent/" \
            scripts/server_entry.py
          .venv/Scripts/python -m PyInstaller --noconfirm --onefile --name agent-supervisor \
            scripts/supervisor_entry.py
          ls -l dist/

      - name: Generate app icon (png/svg + win ico)
        shell: bash
        run: .venv/Scripts/python scripts/make-icon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # same guard as `predist`, which vite/npm does not run for dist:win
      - name: Check transport_defaults drift
        shell: bash
        run: bash scripts/check-transport-defaults.sh

      # platform extraResources/icon guard (no build): see ui/verify-build-config.js
      - name: Verify builder config
        working-directory: ui
        run: node verify-build-config.js

      # font wiring guard: the deb job runs it; windows-debug.yml omits it
      - name: Verify UI fonts
        shell: bash
        run: .venv/Scripts/python -m tests.ui_fonts_check

      - name: Build unsigned NSIS installer
        working-directory: ui
        run: npm run dist:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutch-win
          path: ui/dist/*.exe

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.exe

  # ---- pylibs-matrix (M2 supply line for Android, docs/android/02 §7) ----
  # The phone has no pip/bash: its pylibs tar comes from these CI prebuilts
  # (byte-deterministic, so the tar's sha256 IS the remote's VERSION gate and
  # the phone's ~/.clutch/bundles cache stays valid). Wheels are fetched for
  # the TARGET (pip --platform), so no QEMU/cross toolchain is needed — the
  # build script already cross-downloads for the desktop's cross remotes.
  # openai/httpx2 versions come from uv.lock — the same pins the desktop's
  # venvPin() bakes into its cache keys (docs §7 "与桌面发布同源").
  # Determinism rests on the pinned interpreter (3.11) + locked wheels; a pip
  # patch upgrade shifting bytes is safe by design: a new hash simply becomes
  # a new VERSION on the remote (one reinstall), never a silent mismatch.
  pylibs-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.10", "3.11", "3.12", "3.13"]
        arch: [x86_64, aarch64]
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v4
      # no submodules: the tar carries agent/ + site-packages only; the tool
      # modules are installed onto the remote later via components install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync python deps (pins openai/httpx2 from uv.lock)
        run: uv sync

      - name: Build pylibs tar (linux/${{ matrix.arch }}/${{ matrix.libc }} py${{ matrix.pyver }})
        id: build
        run: |
          set -euo pipefail
          bash scripts/build-pylibs-tar.sh build pylibs.tar.gz \
            Linux ${{ matrix.arch }} ${{ matrix.libc }} ${{ matrix.pyver }}
          SHA256="$(sha256sum pylibs.tar.gz | cut -d' ' -f1)"
          NAME="agent-pylibs-linux-${{ matrix.arch }}-${{ matrix.libc }}-py${{ matrix.pyver }}-${SHA256:0:16}.tar.gz"
          mv pylibs.tar.gz "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pylibs-linux-${{ matrix.arch }}-${{ matrix.libc }}-py${{ matrix.pyver }}
          path: ${{ steps.build.outputs.file }}
          if-no-files-found: error

  # Assemble the release index the Android downloader reads (N3): one entry per
  # target, keyed exactly like artifact-provider-android.js builds its key
  # ("<os>-<arch>-<libc>-py<ver>", lowercase). The filename hash must equal the
  # content hash — the M2 acceptance is "remote VERSION == tar hash", and the
  # phone recomputes the hash instead of trusting this manifest.
  pylibs-index:
    needs: pylibs-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pylibs-*
          merge-multiple: true

      - name: Build pylibs-index.json
        run: |
          python3 - <<'EOF'
          import hashlib, json, pathlib
          tars = sorted(pathlib.Path("artifacts").glob("agent-pylibs-*.tar.gz"))
          assert tars, "no pylibs artifacts found"
          index = {}
          for p in tars:
              # agent-pylibs-linux-<arch>-<libc>-py<ver>-<hash16>.tar.gz
              key = p.name[len("agent-pylibs-"):-len(".tar.gz")].rsplit("-", 1)[0]
              stated = p.name.rsplit("-", 1)[-1][:16]
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              assert stated == sha[:16], f"{p.name}: filename hash {stated} != content {sha[:16]}"
              index[key] = {"file": p.name, "sha256": sha, "version": sha[:16]}
          pathlib.Path("pylibs-index.json").write_text(json.dumps(index, indent=1, sort_keys=True) + "\n")
          print(json.dumps(index, indent=1))
          EOF

      - name: Attach tars + index to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pylibs-index.json
            artifacts/agent-pylibs-*.tar.gz

  # ---- android-apk (M3: the phone build, docs/android/02 §8) ----
  # needs: pylibs-index, not just for ordering — this job stamps the URL of
  # THIS tag's pylibs-index.json release asset into the APK, so that URL only
  # resolves after pylibs-index's attach step above has completed (needs =
  # whole job, attach included). The APK is a DEBUG build signed with the
  # PROJECT's own keystore (android/keystore/clutch.jks, wired in
  # android/app/build.gradle): debug-flavoured to keep the WebView debuggable,
  # and signed by ONE stable certificate so each release installs over the
  # previous one — a runner's auto-generated debug keystore gave every release a
  # key of its own, which turned every "install over" into a reinstall.
  android-apk:
    needs: pylibs-index
    runs-on: ubuntu-latest
    steps:
      # no submodules: the APK carries android/host + the in-repo ui/ subset
      # (components.js and ui/vendor are tracked files); pylibs reach the
      # phone at RUNTIME through the stamped index, never at build time
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17" # AGP 8.5 floor

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # sync-android-host.sh runs npm install for the host bundle

      # do NOT assume the image preinstalls the Android SDK (the first
      # android-debug run died 127 on a bare `sdkmanager`): resolve it or
      # install cmdline-tools explicitly, then let AGP know via ANDROID_HOME
      - name: Ensure Android SDK + components
        run: |
          set -euo pipefail
          AH="${ANDROID_HOME:-$HOME/Android/Sdk}"
          SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "no preinstalled sdkmanager at $SDKM — installing cmdline-tools"
            mkdir -p "$AH/cmdline-tools"
            curl -sSL --fail -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdtools.zip -d cmdtools-x
            mv cmdtools-x/cmdline-tools "$AH/cmdline-tools/latest"
            rm -rf cmdtools.zip cmdtools-x
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          bash scripts/build-android-apk.sh \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pylibs-index.json" \
            "${GITHUB_REF_NAME#v}" \
            "clutch-android-${GITHUB_REF_NAME}.apk" 2>&1 | tee /tmp/clutch-apk-build.log

      # Whose eyes need this? The person who notices a broken APK is holding the
      # PHONE, and a failure here can also be read by tooling that has no
      # Actions-log access (the log endpoint wants admin rights). So a failed
      # build leaves its own tail as a COMMENT ON THE COMMIT — readable by
      # anyone, from anywhere, with no token.
      - name: Post the build log where a failure can be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          log = pathlib.Path("/tmp/clutch-apk-build.log")
          tail = log.read_text(errors="replace")[-6000:] if log.exists() else "(no build log was captured)"
          body = "android-apk build failed (run %s, commit %s)\n\n```\n%s\n```\n" % (
              os.environ.get("GITHUB_RUN_ID", "?"), os.environ.get("GITHUB_SHA", "?"), tail)
          pathlib.Path("/tmp/clutch-apk-comment.json").write_text(json.dumps({"body": body}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data @/tmp/clutch-apk-comment.json -o /tmp/clutch-apk-comment.out -w 'comment: HTTP %{http_code}\n' \
            || echo "could not post the build log (the job already failed; this is only the report)"

      - uses: actions/upload-artifact@v4
        with:
          name: clutch-android-apk
          path: clutch-android-*.apk
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: clutch-android-*.apk
