plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.clutch.mobile'
    compileSdk 34
    // pinned so a CI runner's sdkmanager install and AGP's default resolve to
    // the same NDK instead of "whatever is newest" (AGP 8.5's own default is
    // exactly this build; stating it makes the CI contract explicit)
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'io.clutch.mobile'
        minSdk 24        // nodejs-mobile floor is 21; 24 covers the WebView APIs we use
        targetSdk 34
        versionCode 1
        // release CI stamps the tag (build-android-apk.sh -PAPP_VERSION=vX.Y.Z);
        // the default keeps plain `gradlew assembleDebug` working from a checkout
        versionName (project.findProperty('APP_VERSION')?.toString() ?: '0.1.0')
        // armeabi-v7a ships in jniLibs too — add it here when a 32-bit device is targeted
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        // extract libnode.so to the app lib dir so the JNI shim resolves it by soname
        jniLibs { useLegacyPackaging = true }
    }

    // ONE signing key for every build, local and CI — because Android refuses to
    // install an APK over the previous one unless the certificate matches. A
    // runner's auto-generated debug keystore made the certificate a property of
    // the BUILD MACHINE: v0.1.21 and v0.1.22 carry different cert digests, and
    // installing either over the other means uninstalling first (which wipes the
    // app's data). The key is a project property now, so the same certificate
    // signs every release forever; passwords live in gradle.properties (a
    // side-load project with no store listing — the key's job is upgrade
    // continuity, not protection from a stranger who already has the source).
    signingConfigs {
        clutch {
            // rootProject.file: the property is written relative to android/, so
            // "keystore/clutch.jks" must resolve there and not against app/
            storeFile rootProject.file(project.findProperty('SIGNING_STORE_FILE')
                ?: 'keystore/clutch.jks')
            storePassword project.findProperty('SIGNING_STORE_PASSWORD') ?: 'clutchsign'
            keyAlias project.findProperty('SIGNING_KEY_ALIAS') ?: 'clutch'
            keyPassword project.findProperty('SIGNING_KEY_PASSWORD') ?: 'clutchsign'
        }
    }

    buildTypes {
        // BOTH types are signed with the project key: the shipped artifact is
        // assembleDebug (WebView-debuggable, see scripts/build-android-apk.sh),
        // and a debug build signed by AGP's machine-local key is exactly the
        // thing that made each release un-upgradeable.
        debug {
            signingConfig signingConfigs.clutch
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.clutch
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // WebViewAssetLoader (https origin for the assets-loaded render layer)
    implementation 'androidx.webkit:webkit:1.11.0'
}
