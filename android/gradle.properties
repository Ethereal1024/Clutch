org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The project's ONE Android signing key (android/keystore/clutch.jks), used by
# both build types so every APK — this machine's and CI's — is signed with the
# same certificate and can be installed over the previous one. Override any of
# these with -P<name>=<value> (or an environment the CI passes through) when a
# build must use a different key; see android/README.md.
SIGNING_STORE_FILE=keystore/clutch.jks
SIGNING_STORE_PASSWORD=clutchsign
SIGNING_KEY_ALIAS=clutch
SIGNING_KEY_PASSWORD=clutchsign
