[project]
name = "clutch-memory"
version = "0.1.0"
description = "Standalone project-memory CLI: save/load/search the memories inside a .clc via the agent server's generic .clc content endpoints."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
