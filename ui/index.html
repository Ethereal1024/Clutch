<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clutch — coding agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo">▣</span> clutch</div>
    <div id="status" class="badge idle">idle</div>
    <div class="spacer"></div>
    <select id="session-select" title="replay a past session">
      <option value="">live session</option>
    </select>
    <button id="settings-btn" title="API settings">⚙</button>
    <button id="stop-btn" disabled title="cancel the running agent">■ Stop</button>
  </header>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h3>API settings</h3>
      <label for="api-key-input">DeepSeek API key</label>
      <input id="api-key-input" type="password" placeholder="sk-..." autocomplete="off" />
      <p class="muted">Stored outside the repo (~/.clutch/settings.json). Overrides the environment variable for this server.</p>
      <div class="modal-actions">
        <button id="settings-save" class="primary">Save</button>
        <button id="settings-close">Cancel</button>
      </div>
    </div>
  </div>

  <main>
    <section id="left">
      <div id="taskbar">
        <textarea id="task-input" rows="3"
          placeholder="Describe a coding task for the agent, e.g.: build a landing page for our product from content.md"></textarea>
        <div class="actions">
          <button id="run-btn" class="primary">▶ Run</button>
          <span id="sandbox-path" class="muted" title="active sandbox directory"></span>
        </div>
      </div>
      <div id="stream" class="scroll"></div>
    </section>

    <aside id="right">
      <div class="panel-head">sandbox <span id="tree-refresh" class="muted">⟳</span></div>
      <div id="tree" class="scroll"></div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
