# Clutch — Linux desktop app packaging (deb).
#
# The deb is self-contained: the Python side ships inside it as the
# PyInstaller onefile binaries (extraResources -> /opt/Clutch/resources/agent-server
# and agent-supervisor) and the Electron main process pulls the supervisor up on
# launch (ui/server-bootstrap.js), so the user needs no python, no pip and no
# network after `dpkg -i`.
#
# Build (from repo root):  bash scripts/release.sh
#   (builds dist/agent-server, copies ui/transport_defaults.json, runs
#    electron-builder with the npmmirror fallback env vars)

appId: io.clutch.desktop
productName: Clutch
executableName: clutch

directories:
  buildResources: build   # ui/build/icon.png (generated by scripts/make-icon.py)
  output: dist

# exclude dev-only files from the app bundle
files:
  - "!dev.sh"
  # the asset survey doc next to the vendored fonts is for the repo, not runtime
  - "!vendor/fonts/README.md"

# Native-dependency rebuild is OFF on purpose — it is what made `npm run dist`
# depend on the host compiler.
#
# @electron/rebuild only rebuilds packages carrying a binding.gyp at their OWN
# root — rebuild.js:98 is
#   candidatePaths.filter((p) => fs.existsSync(path.resolve(p, "binding.gyp")))
# Under ui/ that matches exactly one package: cpu-features 0.0.10, an OPTIONAL
# dependency of ssh2. (ssh2's own binding lives one level down at
# lib/protocol/crypto/binding.gyp and is built by its install.js during `npm ci`,
# so the rebuild step never touched ssh2.)
#
# Rebuilding cpu-features against Electron's ABI is where GNU/Linux builds die:
# electron@44's common.gypi sets v8_deprecation_warnings, so node-gyp compiles
# with -DV8_DEPRECATION_WARNINGS=1, and Electron's using_v8_shared adds
# -DUSING_V8_SHARED=1. Those two together expand v8-primitive.h into
#
#   class [[deprecated("...")]] __attribute__((visibility("default"))) Value
#
# i.e. a class-head carrying a C++ attribute followed by a GNU one. GCC <= 12
# rejects that ("expected identifier before '__attribute__'", then "expected
# primary-expression before 'public'"); only GCC >= 13 / clang >= 16 parse it.
# Ubuntu 22.04 ships GCC 11, so packaging there needed CC/CXX wrappers that
# append -UV8_DEPRECATION_WARNINGS — a host-side hack in every contributor's
# shell. Skipping the rebuild removes the compiler from the build entirely.
#
# Dropping it is safe: nothing needed goes missing.
#   - cpu-features is optional, and ssh2/lib/protocol/constants.js:6-9 wraps the
#     require in a bare `try {} catch {}`. The copy `npm ci` built is a
#     NODE_MODULE_VERSION 127 (node 22) binary; Electron 44 is 149, so it cannot
#     load there at all, and all that is lost is the CPU-feature query that
#     reorders the cipher preference list (constants.js:94-105).
#   - ssh2's sshcrypto.node is likewise the npm-ci/node-ABI copy, which crypto.js
#     already handles the same way (require wrapped in try/catch at :29-33,
#     exported as bindingAvailable at :1579, falling back to the node:crypto
#     cipher/decipher classes). This key changes nothing about that.
#
# app-builder-lib/out/packager.js:454 returns before install/rebuild whenever
# this is false, so nothing else is affected.
#
# If a REQUIRED native module is ever added under ui/, delete this key and pin
# the toolchain instead (clang >= 16, or GCC >= 13).
npmRebuild: false

# The bundled backend binaries (built by scripts/build-server-bundle.sh; both
# live in dist/ — agent-server and agent-supervisor) are declared per platform
# instead of at the top level: electron-builder ADDS platform-specific
# extraResources to the root list rather than replacing it (fileMatcher.js:
# addPatterns(config[name]) then addPatterns(customBuildOptions[name])), so a
# root list would leak the POSIX names into the Windows bundle. Windows carries
# the .exe suffix (ui/server-bootstrap.js spawns them with .exe on win32).

linux:
  target:
    - deb
  extraResources:
    - from: ../dist/agent-server
      to: agent-server
    - from: ../dist/agent-supervisor
      to: agent-supervisor
  # .desktop Categories (appended with ";"); the deb Section is packageCategory
  category: Development;Utility
  packageCategory: devel
  maintainer: Clutch Developers <dev@clutch.invalid>
  synopsis: Autonomous coding agent driven by a GUI
  # used as the .desktop Comment and the second line of the control Description
  description: >-
    clutch is an autonomous coding agent: give it a one-line task and it reads,
    writes and runs code by talking to a large language model until the
    verification gate proves the task done. The GUI is an Electron shell; the
    backend (clutch-server) is bundled and started automatically on launch.
  # desktopName in package.json ("clutch.desktop") -> app_id "clutch";
  # StartupWMClass is derived from it automatically, so the WM associates the
  # running window with the .desktop entry.
  syncDesktopName: true
  icon: build/icon.png

deb:
  priority: optional
  mimeTypes:
    - application/x-clutch-project

# macOS: unsigned dmg (Apple Silicon). electron-builder cannot cross-build mac
# targets from Linux — build on a Mac (scripts/release-mac.sh) or the CI
# macos-latest job in .github/workflows/release.yml.
#
# Unsigned on purpose (no Apple Developer cert): Gatekeeper blocks the first
# launch — right-click Clutch.app -> Open, or clear the quarantine flag:
#   xattr -cr /Applications/Clutch.app
# To sign+notarize later: set mac.identity to a Developer ID Application cert
# and notarize: true with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
mac:
  target:
    - target: dmg
      arch: [arm64] # Apple Silicon; Intel needs an x64 build on an x64 Mac
  category: public.app-category.developer-tools
  # build/icon.png (512px, generated by scripts/make-icon.py) is converted to
  # .icns automatically by electron-builder
  icon: build/icon.png
  identity: null # skip codesign lookup; PyInstaller output stays ad-hoc signed
  extraResources:
    - from: ../dist/agent-server
      to: agent-server
    - from: ../dist/agent-supervisor
      to: agent-supervisor

dmg:
  title: Clutch

# Windows: unsigned NSIS installer (x64). Same self-contained shape as the deb
# — the PyInstaller onefile binaries ride in extraResources, with the .exe
# names Windows produces (the POSIX names stay in the linux:/mac: sections
# above, so this list is the only one that applies here).
#
# Unsigned on purpose (no code-signing cert): SmartScreen warns on the first
# run ("Windows protected your PC" -> More info -> Run anyway). Debug builds
# are produced by .github/workflows/windows-debug.yml (workflow_dispatch, no
# release attached); a future release job only needs the same npm run dist:win.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico # pure-stdlib ico from scripts/make-icon.py
  extraResources:
    - from: ../dist/agent-server.exe
      to: agent-server.exe
    - from: ../dist/agent-supervisor.exe
      to: agent-supervisor.exe

nsis:
  oneClick: false # allow "install for me only" vs per-machine
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Clutch
