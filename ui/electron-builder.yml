# Clutch — Linux desktop app packaging (deb).
#
# The deb is self-contained: the Python side ships inside it as the
# PyInstaller onefile binaries (extraResources -> /opt/Clutch/resources/agent-server
# and agent-supervisor) and the Electron main process pulls the supervisor up on
# launch (ui/server-bootstrap.js), so the user needs no python, no pip and no
# network after `dpkg -i`.
#
# Build (from repo root):  bash scripts/release.sh
#   (builds dist/agent-server, copies ui/transport_defaults.json, runs
#    electron-builder with the npmmirror fallback env vars)

appId: io.clutch.desktop
productName: Clutch
executableName: clutch

directories:
  buildResources: build   # ui/build/icon.png (generated by scripts/make-icon.py)
  output: dist

# exclude dev-only files from the app bundle
files:
  - "!dev.sh"
  - "!ssh-tunnel.test.js"

# the bundled backend binaries (built by scripts/build-server-bundle.sh;
# both live in dist/ — agent-server and agent-supervisor)
extraResources:
  - from: ../dist/agent-server
    to: agent-server
  - from: ../dist/agent-supervisor
    to: agent-supervisor

linux:
  target:
    - deb
  # .desktop Categories (appended with ";"); the deb Section is packageCategory
  category: Development;Utility
  packageCategory: devel
  maintainer: Clutch Developers <dev@clutch.invalid>
  synopsis: Autonomous coding agent driven by a GUI
  # used as the .desktop Comment and the second line of the control Description
  description: >-
    clutch is an autonomous coding agent: give it a one-line task and it reads,
    writes and runs code by talking to a large language model until the
    verification gate proves the task done. The GUI is an Electron shell; the
    backend (clutch-server) is bundled and started automatically on launch.
  # desktopName in package.json ("clutch.desktop") -> app_id "clutch";
  # StartupWMClass is derived from it automatically, so the WM associates the
  # running window with the .desktop entry.
  syncDesktopName: true
  icon: build/icon.png

deb:
  priority: optional
  mimeTypes:
    - application/x-clutch-project
