[project]
name = "clutch"
version = "0.1.0"
description = "A self-built coding agent: LLM loop + tools + events, driven by a GUI. CLI removed."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
