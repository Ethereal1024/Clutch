[project]
name = "clutch"
version = "0.1.0"
description = "A self-built coding agent: LLM loop + tools + events, driven by a GUI. CLI removed."
requires-python = ">=3.8"
license = "MIT"
# None: the agent's Python side is stdlib-only. The model call lives in the
# HOST (ui/src/host/llm.js speaks /chat/completions and /responses), so nothing
# under agent/ imports a third-party wheel any more — the same posture as
# clutch-workspace and clutch-skills. What used to be here (openai + httpx2, and
# through them pydantic / pydantic_core / jiter) was the whole reason the far
# side's tar had to be built per interpreter version: those wheels require
# Python >= 3.9/3.10 and ship no cp38 build, so "support an older remote" meant
# downgrading five packages at once. With nothing to install, the far side needs
# only a python3 new enough for the sources themselves.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# ship the cross-language transport defaults (workspace.py and ui/ssh-tunnel.js
# both read this single source for the remote wire limits)
[tool.hatch.build.targets.wheel.force-include]
"agent/transport_defaults.json" = "agent/transport_defaults.json"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
