[project]
name = "clutch"
version = "0.1.0"
description = "A self-built coding agent: LLM loop + tools + events, driven by a GUI. CLI removed."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
