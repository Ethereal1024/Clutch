[project]
name = "clutch"
version = "0.1.0"
description = "A self-built coding agent: LLM loop + tools + events, driven by a GUI. CLI removed."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# ship the cross-language transport defaults (workspace.py and ui/ssh-tunnel.js
# both read this single source for the remote wire limits)
[tool.hatch.build.targets.wheel.force-include]
"agent/transport_defaults.json" = "agent/transport_defaults.json"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
