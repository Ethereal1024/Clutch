[project]
name = "clutch-websearch"
version = "0.1.0"
description = "Standalone web search + page fetch CLI: a backend chain (tavily/searxng/bing/ddg) and link-preserving HTML extraction, stdlib only."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
